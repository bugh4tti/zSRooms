# Configuración de zSRooms
# Colores con &, y hex con &#RRGGBB o &x&R&R&G&G&B&B
# Los textos que tengan # o & van entre comillas

settings:
  # segundos hasta que se abre la barrera cuando alguien
  # muere, se va de la room o se desconecta
  open-delay:
    death: 10
    leave: 10
    disconnect: 5

  # segundos de espera al usar /spawn dentro de una room (0 = sin espera)
  spawn-delay: 5
  # el comando de spawn de tu server, sin la barra
  spawn-command: spawn

  # cuando se abre la barrera, mandar a los que queden a la zona del pico
  teleport-on-open: true

  # anunciar al ganador también si el rival se desconecta
  announce-on-disconnect: false

  # si está en true, los que tengan el permiso zsrooms.bypass no entran a las rooms
  # (dejalo en false si probás siendo OP)
  use-bypass: false

  # material de la barrera cuando creás una room (después se cambia con /room blocks)
  default-barrier-block: GLASS
  # máximo de bloques que puede tener la zona de la barrera
  max-barrier-blocks: 300000

  # bloques que no se pueden poner cuando utilities está en off
  # lo que empieza con * es "termina en", así *_WOOL son todas las lanas
  utility-blocks:
    - COBWEB
    - "*_WOOL"

# sonidos de entrar y salir de la room
# se escriben como en el juego (los de /playsound), por ejemplo entity.player.levelup
# si dejás el sound vacío ("") no suena nada
sounds:
  enter:
    sound: "block.note_block.pling"
    volume: 1.0
    pitch: 1.5
  leave:
    sound: "entity.enderman.teleport"
    volume: 1.0
    pitch: 1.0


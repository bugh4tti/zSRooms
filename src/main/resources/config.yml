# =====================================================================
#  zSRooms - config.yml
#  Colores: &a, hex &#RRGGBB, hex &x&R&R&G&G&B&B y #RRGGBB
#  IMPORTANTE: los textos con # o & van SIEMPRE entre comillas.
# =====================================================================

settings:
  # Segundos desde que entra el 2do jugador hasta que se habilita el PvP
  start-delay: 5

  # Contadores (en segundos) para que la barrera se abra (la room se cierra).
  # Cada uno se usa según el motivo:
  open-delay:
    death: 10        # alguien murió en la room
    leave: 10        # alguien salió de la room (o tiró /spawn)
    disconnect: 5    # alguien se desconectó

  # Segundos de espera al usar /spawn dentro de una room (0 = instantáneo)
  spawn-delay: 5
  # Comando de spawn de tu server (sin /)
  spawn-command: spawn

  # La barrera se cierra sola cuando entra el 2do jugador
  close-barrier-on-start: true
  # Al abrirse la barrera, los jugadores que queden son enviados a la zona del pico
  teleport-on-open: true
  # Anunciar ganador también cuando el rival se desconecta
  announce-on-disconnect: false

  # Bloque por defecto de la barrera
  default-barrier-block: GLASS
  # Máximo de bloques de la zona de barrera (azada)
  max-barrier-blocks: 300000

  # Bloques que NO se pueden poner cuando utilities = off
  # (un * al inicio significa "termina en", así "*_WOOL" son todas las lanas)
  utility-blocks:
    - COBWEB
    - "*_WOOL"


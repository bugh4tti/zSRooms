# Configuración de zSRooms
# Colores con &, y hex con &#RRGGBB o &x&R&R&G&G&B&B
# Los textos que tengan # o & van entre comillas
# Las rooms se editan en room.yml (después usá /room reload)

settings:
  # segundos hasta que se abre la barrera cuando alguien
  # muere, se va de la room o se desconecta
  # (también se cambian desde el juego: /room times)
  open-delay:
    death: 10
    leave: 10
    disconnect: 5

  # cómo se muestra el contador de apertura: chat, actionbar o both
  countdown-display: chat

  # segundos de espera al usar /spawn dentro de una room (0 = sin espera)
  spawn-delay: 5
  # el comando de spawn de tu server, sin la barra
  spawn-command: spawn

  # anunciar al ganador también si el rival se desconecta
  announce-on-disconnect: false

  # si está en true, los que tengan el permiso zsrooms.bypass no entran a las rooms
  # (dejalo en false si probás siendo OP)
  use-bypass: false

  # material de la barrera cuando creás una room (después se cambia con /room blocks)
  default-barrier-block: GLASS
  # máximo de bloques que puede tener la zona de la barrera
  max-barrier-blocks: 300000

  # bloques que se controlan con /room utilities
  # utilities off: no se pueden poner
  # utilities on: se pueden poner y romper aunque la región no deje
  # lo que empieza con * es "termina en", así *_WOOL son todas las lanas
  utility-blocks:
    - COBWEB
    - "*_WOOL"

# rooms por equipos (2v2, 3v3, 4v4)
team:
  # segundos de cuenta regresiva antes de empezar el combate
  countdown: 5
  # segundos que dura una invitación
  invite-seconds: 60
  # si está en true los aliados se pueden pegar entre ellos
  friendly-fire: false

# apuestas (rooms con /room bet <room> on)
bet:
  # segundos del contador cuando los dos aceptan (suena el reloj en cada segundo)
  countdown: 10
  # mínimo de items que tiene que apostar cada uno para poder aceptar (0 = sin mínimo)
  min-items: 1
  # items que no se pueden apostar (nombres de Material, ej: BEDROCK)
  blocked-items: []

# partículas que salen al marcar con cada herramienta (las ve solo quien marca)
# poné el nombre de Particle de tu versión (FLAME, SOUL_FIRE_FLAME, COMPOSTER, END_ROD, CRIT...)
# si dejás particle vacío ("") no sale nada
particles:
  # hacha
  axe:
    particle: FLAME
    count: 30
  # pico
  pick:
    particle: SOUL_FIRE_FLAME
    count: 30
  # azada
  hoe:
    particle: COMPOSTER
    count: 30

# sonidos de la room
# se escriben como en el juego (los de /playsound), por ejemplo entity.player.levelup
# si dejás el sound vacío ("") no suena nada
sounds:
  enter:
    sound: "block.note_block.pling"
    volume: 1.0
    pitch: 1.5
  leave:
    sound: "entity.enderman.teleport"
    volume: 1.0
    pitch: 1.0
  # suena en cada segundo de los contadores (apertura, teams y apuesta)
  countdown:
    sound: "block.note_block.hat"
    volume: 1.0
    pitch: 1.5

